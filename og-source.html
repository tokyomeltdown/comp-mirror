<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<!--
  Source for docs/og-image.png. Rendered rather than drawn by hand so the card
  keeps the page's colours when they change.

      bash make-og.sh

  1200x630 is what the social cards crop to. Everything that has to survive a
  thumbnail sits in the middle half. Same ground, grid and type as the page.
  On the right, where an app would have its icon, a plug-in has none: a
  screenshot of the Comp Mirror window instead, at its own proportions.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:#eceef0;color:#1b1f23;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(60,66,72,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(60,66,72,.05) 1px,transparent 1px);
    background-size:48px 48px;background-position:-1px -1px}
  .left{position:absolute;left:72px;top:0;bottom:0;width:500px;display:flex;flex-direction:column;justify-content:center}
  .k{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#666d75;margin-bottom:22px}
  h1{font-size:66px;line-height:1.02;font-weight:700;letter-spacing:-.035em}
  .sub{margin-top:24px;font-size:23px;line-height:1.45;color:#4f565e;max-width:20em}
  .foot{margin-top:30px;font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.06em;color:#666d75}
  .foot b{color:#1b1f23;font-weight:600}

  .right{position:absolute;left:610px;right:48px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .band{width:100%;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(27,31,35,.10),0 18px 44px -24px rgba(27,31,35,.35)}
  .band img{display:block;width:100%}
</style>
</head>
<body>
<div class="left">
  <div class="k">Comp Mirror · AU · VST3 · AAX</div>
  <h1>Compression, understood.</h1>
  <p class="sub">What your compressor really does to every hit, measured from the sound.</p>
  <p class="foot">macOS 12+ &nbsp;·&nbsp; Apple silicon &amp; Intel &nbsp;·&nbsp; <b>$18</b></p>
</div>
<div class="right">
  <div class="band"><img src="docs/img/shot-mirror.jpg" alt=""></div>
</div>
</body>
</html>
